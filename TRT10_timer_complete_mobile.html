<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRT10風 トレーニングタイマー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#111;color:#fff;font-family:Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
body{padding:12px}
h1{text-align:center;font-size:24px;margin:8px 0 14px}
h2{font-size:18px;margin:18px 0 8px}
.panel{background:#202020;border:1px solid #444;border-radius:12px;padding:12px;margin-bottom:12px}
.display{background:#000;color:#fff;border-radius:10px;padding:16px;text-align:center;font-size:58px;font-weight:bold;letter-spacing:2px;min-height:92px;display:flex;align-items:center;justify-content:center}
.status{text-align:center;min-height:24px;margin:8px 0;color:#ddd}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font-size:16px;font-weight:bold;padding:11px 14px;border:0;border-radius:8px;background:#444;color:#fff;touch-action:manipulation}
button:active{transform:scale(.97)}
button.primary{background:#1769aa}
button.danger{background:#a33}
button.good{background:#26734d}
button.wide{min-width:120px}
label{font-size:14px}
select,input{font-size:16px}
input{
  color:#111;background:#fff;border:2px solid #777;border-radius:7px;
  padding:9px 6px;text-align:center;width:74px;
  user-select:text;-webkit-user-select:text;
  -webkit-appearance:none;appearance:none;
  touch-action:auto;
}
.program-grid{display:grid;grid-template-columns:1fr;gap:8px}
.program-row{display:flex;align-items:center;justify-content:center;gap:6px;background:#303030;border-radius:8px;padding:8px}
.program-row .name{width:42px;font-weight:bold}
.program-row span{font-size:14px}
.small{font-size:13px;color:#bbb}
.score{display:flex;justify-content:center;gap:20px;align-items:center}
.scorebox{text-align:center}
.scorevalue{font-size:52px;font-weight:bold;background:#000;border-radius:8px;padding:4px 18px;min-width:120px}
.clock{font-size:32px}
.hidden{display:none!important}
@media(max-width:500px){
  .display{font-size:48px}
  button{padding:12px 11px}
  input{width:68px;height:44px;font-size:20px}
}
</style>
</head>
<body>

<h1>TRT10風 トレーニングタイマー</h1>

<div class="panel">
  <div id="mainDisplay" class="display">00:00</div>
  <div id="status" class="status">停止中</div>
  <div class="row">
    <button class="primary" onclick="startCurrent()">スタート</button>
    <button onclick="pauseCurrent()">一時停止</button>
    <button class="danger" onclick="resetCurrent()">リセット</button>
    <button onclick="clearAll()">クリア</button>
  </div>
</div>

<div class="panel">
<h2>モード</h2>
<div class="row">
  <button onclick="setMode('timer')">タイマー</button>
  <button onclick="setMode('stopwatch')">ストップウォッチ</button>
  <button onclick="setMode('upcount')">アップカウント</button>
  <button onclick="setMode('30sec')">30秒タイマー</button>
  <button onclick="setMode('program')">プログラム</button>
  <button onclick="setMode('score')">スコア</button>
  <button onclick="setMode('clock')">時計</button>
</div>
</div>

<div id="timerPanel" class="panel">
<h2>タイマー設定</h2>
<div class="row">
  <label>分 <input id="timerMin" type="text" inputmode="numeric" pattern="[0-9]*" value="1" autocomplete="off"></label>
  <label>秒 <input id="timerSec" type="text" inputmode="numeric" pattern="[0-9]*" value="0" autocomplete="off"></label>
</div>
<div class="row" style="margin-top:8px">
  <button onclick="addSeconds(1)">＋1秒</button>
  <button onclick="addSeconds(10)">＋10秒</button>
  <button onclick="addSeconds(30)">＋30秒</button>
  <button onclick="addSeconds(60)">＋1分</button>
</div>
</div>

<div id="prebellPanel" class="panel">
<h2>予鈴</h2>
<div class="row">
  <label>予鈴1 <input id="pre1" type="text" inputmode="numeric" pattern="[0-9]*" value="0"></label>
  <label>予鈴2 <input id="pre2" type="text" inputmode="numeric" pattern="[0-9]*" value="0"></label>
  <label>予鈴3 <input id="pre3" type="text" inputmode="numeric" pattern="[0-9]*" value="0"></label>
</div>
<div class="small">残り秒数になったら短い予鈴を鳴らします。</div>
</div>

<div id="programPanel" class="panel hidden">
<h2>プログラムタイマー</h2>
<p class="small">ここは直接タップして、スマホの数字キーボードで「分」「秒」を入力できます。</p>

<div class="program-grid">
  <div class="program-row"><span class="name">P1</span><input id="p1min" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="分" autocomplete="off"><span>分</span><input id="p1sec" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="秒" autocomplete="off"><span>秒</span></div>
  <div class="program-row"><span class="name">P2</span><input id="p2min" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="分" autocomplete="off"><span>分</span><input id="p2sec" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="秒" autocomplete="off"><span>秒</span></div>
  <div class="program-row"><span class="name">P3</span><input id="p3min" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="分" autocomplete="off"><span>分</span><input id="p3sec" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="秒" autocomplete="off"><span>秒</span></div>
  <div class="program-row"><span class="name">P4</span><input id="p4min" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="分" autocomplete="off"><span>分</span><input id="p4sec" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="秒" autocomplete="off"><span>秒</span></div>
  <div class="program-row"><span class="name">P5</span><input id="p5min" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="分" autocomplete="off"><span>分</span><input id="p5sec" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="秒" autocomplete="off"><span>秒</span></div>
  <div class="program-row"><span class="name">P6</span><input id="p6min" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="分" autocomplete="off"><span>分</span><input id="p6sec" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="秒" autocomplete="off"><span>秒</span></div>
  <div class="program-row"><span class="name">P7</span><input id="p7min" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="分" autocomplete="off"><span>分</span><input id="p7sec" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="秒" autocomplete="off"><span>秒</span></div>
  <div class="program-row"><span class="name">P8</span><input id="p8min" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="分" autocomplete="off"><span>分</span><input id="p8sec" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="秒" autocomplete="off"><span>秒</span></div>
  <div class="program-row"><span class="name">P9</span><input id="p9min" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="分" autocomplete="off"><span>分</span><input id="p9sec" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="秒" autocomplete="off"><span>秒</span></div>
</div>

<div class="row" style="margin-top:10px">
  <button onclick="programPlus10()">＋10秒</button>
  <button class="good" onclick="savePrograms()">プログラムを保存</button>
  <button class="primary" onclick="startProgram()">開始</button>
</div>

<div style="margin-top:10px" class="row">
  <label>繰り返し回数 <input id="repeatCount" type="text" inputmode="numeric" pattern="[0-9]*" value="1"></label>
  <button onclick="toggleEndless()">無限繰り返し</button>
</div>
<div id="repeatStatus" class="small" style="text-align:center;margin-top:5px">通常繰り返し</div>
</div>

<div id="stopwatchPanel" class="panel hidden">
<h2>ストップウォッチ</h2>
<div class="row">
  <button onclick="splitWatch()">スプリット</button>
  <button onclick="memoryWatch()">メモリー</button>
  <button onclick="clearMemory()">メモリー消去</button>
</div>
<div id="memoryList" class="small" style="margin-top:10px;text-align:center"></div>
</div>

<div id="scorePanel" class="panel hidden">
<h2>スコア</h2>
<div class="score">
  <div class="scorebox">左<div id="scoreL" class="scorevalue">00</div></div>
  <div class="scorebox">右<div id="scoreR" class="scorevalue">00</div></div>
</div>
<div class="row" style="margin-top:10px">
  <button onclick="scoreAdd('L',1)">左＋1</button>
  <button onclick="scoreAdd('L',-1)">左－1</button>
  <button onclick="scoreAdd('R',1)">右＋1</button>
  <button onclick="scoreAdd('R',-1)">右－1</button>
  <button class="danger" onclick="resetScore()">スコアリセット</button>
</div>
</div>

<div id="clockPanel" class="panel hidden">
<h2>時計・アラーム</h2>
<div id="clockDisplay" class="clock">00:00:00</div>
<div class="row" style="margin-top:8px">
  <label>アラーム時 <input id="alarmH" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="時"></label>
  <label>分 <input id="alarmM" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="分"></label>
  <button onclick="setAlarm()">アラーム設定</button>
  <button onclick="cancelAlarm()">解除</button>
</div>
</div>

<div class="panel">
<h2>サウンド</h2>
<div class="row">
  <button onclick="testBeep()">音をテスト</button>
  <button onclick="toggleSound()">ブザーON/OFF</button>
</div>
<div id="soundStatus" class="small" style="text-align:center;margin-top:5px">ブザー ON</div>
</div>

<script>
let mode="timer";
let running=false;
let timerId=null;
let remaining=60000;
let stopwatch=0;
let upcount=0;
let thirty=30000;
let programTimes=[];
let programIndex=0;
let programRepeats=0;
let endless=false;
let programRunning=false;
let soundOn=true;
let audioCtx=null;
let splitTimes=[];
let scores={L:0,R:0};
let alarm=null;

const $=id=>document.getElementById(id);

function cleanInput(el,max){
  el.value=String(el.value).replace(/[^0-9]/g,"");
  if(el.value==="") return 0;
  let n=parseInt(el.value,10)||0;
  if(n>max){n=max;el.value=String(max)}
  return n;
}

document.querySelectorAll('input[inputmode="numeric"]').forEach(el=>{
  el.addEventListener("input",()=>{el.value=el.value.replace(/[^0-9]/g,"")});
});

function setMode(m){
  stopLoop();
  mode=m;
  ["timerPanel","prebellPanel","programPanel","stopwatchPanel","scorePanel","clockPanel"].forEach(id=>$(id).classList.add("hidden"));
  if(m==="timer"){ $("timerPanel").classList.remove("hidden"); $("prebellPanel").classList.remove("hidden"); remaining=getTimerValue(); }
  if(m==="stopwatch"){ $("stopwatchPanel").classList.remove("hidden"); remaining=stopwatch; }
  if(m==="upcount"){ remaining=upcount; }
  if(m==="30sec"){ remaining=thirty; }
  if(m==="program"){ $("programPanel").classList.remove("hidden"); remaining=programTimes[0]||0; }
  if(m==="score"){ $("scorePanel").classList.remove("hidden"); }
  if(m==="clock"){ $("clockPanel").classList.remove("hidden"); }
  render();
}

function getTimerValue(){
  const min=cleanInput($("timerMin"),99);
  const sec=cleanInput($("timerSec"),59);
  return (min*60+sec)*1000;
}

function startCurrent(){
  if(mode==="program"){startProgram();return}
  if(mode==="clock")return;
  if(running)return;
  running=true;
  $("status").textContent="動作中";
  timerId=setInterval(tick,50);
}
function pauseCurrent(){running=false;stopLoop();$("status").textContent="一時停止"}
function stopLoop(){if(timerId){clearInterval(timerId);timerId=null}running=false}

function resetCurrent(){
  stopLoop();
  if(mode==="timer") remaining=getTimerValue();
  if(mode==="stopwatch") stopwatch=0,remaining=0;
  if(mode==="upcount") upcount=0,remaining=0;
  if(mode==="30sec") thirty=30000,remaining=thirty;
  if(mode==="program"){programIndex=0;programRepeats=0;remaining=programTimes[0]||0}
  render();
  $("status").textContent="停止中";
}

function clearAll(){
  stopLoop();
  remaining=0; stopwatch=0; upcount=0; thirty=30000;
  render();
  $("status").textContent="クリア";
}

function tick(){
  if(mode==="timer"){
    remaining-=50;
    checkPrebells();
    if(remaining<=0){remaining=0;finishBeep();stopLoop();$("status").textContent="終了"}
  }else if(mode==="stopwatch"){
    stopwatch+=50;remaining=stopwatch;
  }else if(mode==="upcount"){
    upcount+=50;remaining=upcount;
    if(upcount>=3599000){finishBeep();stopLoop()}
  }else if(mode==="30sec"){
    thirty-=50;remaining=thirty;
    if(thirty<=0){thirty=0;remaining=0;finishBeep();stopLoop();$("status").textContent="終了"}
  }
  render();
}

function render(){
  let ms=remaining;
  if(mode==="clock")return;
  if(mode==="stopwatch" || mode==="upcount"){
    $("mainDisplay").textContent=formatTime(ms,true);
  }else{
    $("mainDisplay").textContent=formatTime(Math.max(0,ms),false);
  }
}

function formatTime(ms,centi){
  let total=Math.floor(ms/1000);
  let m=Math.floor(total/60);
  let s=total%60;
  if(centi){
    let c=Math.floor((ms%1000)/10);
    return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(c).padStart(2,"0")}`;
  }
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function addSeconds(sec){
  remaining=getTimerValue()+sec*1000;
  let total=Math.floor(remaining/1000);
  $("timerMin").value=Math.floor(total/60);
  $("timerSec").value=total%60;
  render();
}

function checkPrebells(){
  [1,2,3].forEach(i=>{
    let n=cleanInput($("pre"+i),99999);
    if(n>0 && remaining<=n*1000 && remaining>n*1000-50) beep(1);
  });
}

function programPlus10(){
  const idx=programIndex+1;
  const secEl=$("p"+idx+"sec");
  if(!secEl)return;
  let sec=cleanInput(secEl,59)+10;
  let min=cleanInput($("p"+idx+"min"),99);
  if(sec>=60){sec-=60;min=Math.min(99,min+1)}
  secEl.value=sec;
  $("p"+idx+"min").value=min;
}

function savePrograms(){
  programTimes=[];
  for(let i=1;i<=9;i++){
    let min=cleanInput($("p"+i+"min"),99);
    let sec=cleanInput($("p"+i+"sec"),59);
    programTimes.push((min*60+sec)*1000);
  }
  let repeat=cleanInput($("repeatCount"),99);
  if(repeat<1){repeat=1;$("repeatCount").value=1}
  $("repeatStatus").textContent=endless?"無限繰り返し":"通常："+repeat+"回";
  programIndex=0;
  remaining=programTimes[0]||0;
  $("status").textContent="プログラム保存完了";
  render();
}

function startProgram(){
  savePrograms();
  if(!programTimes.some(x=>x>0)){alert("P1〜P9のどこかに時間を入力してください。");return}
  programIndex=0;
  programRepeats=0;
  programRunning=true;
  running=true;
  $("status").textContent="P1 実行中";
  timerId=setInterval(programTick,50);
}

function programTick(){
  remaining-=50;
  if(remaining<=0){
    remaining=0;finishBeep();
    nextProgram();
    return;
  }
  render();
}

function nextProgram(){
  let next=programIndex+1;
  while(next<programTimes.length && programTimes[next]<=0)next++;
  if(next<programTimes.length){
    programIndex=next;
    remaining=programTimes[programIndex];
    $("status").textContent="P"+(programIndex+1)+" 実行中";
  }else{
    programRepeats++;
    const maxRepeat=cleanInput($("repeatCount"),99)||1;
    if(endless || programRepeats<maxRepeat){
      programIndex=0;
      while(programIndex<programTimes.length && programTimes[programIndex]<=0)programIndex++;
      remaining=programTimes[programIndex]||0;
      $("status").textContent="繰り返し "+(programRepeats+1);
    }else{
      stopLoop();
      programRunning=false;
      $("status").textContent="プログラム終了";
    }
  }
  render();
}

function toggleEndless(){
  endless=!endless;
  $("repeatStatus").textContent=endless?"無限繰り返し":"通常繰り返し";
}

function splitWatch(){
  if(mode!=="stopwatch")return;
  splitTimes.push(stopwatch);
  if(splitTimes.length>30)splitTimes.shift();
  showMemory();
}
function memoryWatch(){splitWatch()}
function clearMemory(){splitTimes=[];showMemory()}
function showMemory(){
  $("memoryList").innerHTML=splitTimes.map((x,i)=>`${i+1}: ${formatTime(x,true)}`).join("<br>");
}

function scoreAdd(side,n){
  scores[side]=Math.max(0,Math.min(99,scores[side]+n));
  updateScore();
}
function resetScore(){scores={L:0,R:0};updateScore()}
function updateScore(){
  $("scoreL").textContent=String(scores.L).padStart(2,"0");
  $("scoreR").textContent=String(scores.R).padStart(2,"0");
}

function beep(count=3){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    for(let i=0;i<count;i++){
      const start=audioCtx.currentTime+i*0.38;
      const osc=audioCtx.createOscillator();
      const gain=audioCtx.createGain();
      osc.type="square";
      osc.frequency.setValueAtTime(2500,start);
      gain.gain.setValueAtTime(0.0001,start);
      gain.gain.exponentialRampToValueAtTime(0.8,start+0.01);
      gain.gain.setValueAtTime(0.8,start+0.22);
      gain.gain.exponentialRampToValueAtTime(0.0001,start+0.27);
      osc.connect(gain);gain.connect(audioCtx.destination);
      osc.start(start);osc.stop(start+0.28);
    }
  }catch(e){}
}
function finishBeep(){beep(3)}
function testBeep(){beep(3)}
function toggleSound(){
  soundOn=!soundOn;
  $("soundStatus").textContent=soundOn?"ブザー ON":"ブザー OFF";
}

function updateClock(){
  const d=new Date();
  $("clockDisplay").textContent=
    String(d.getHours()).padStart(2,"0")+":"+
    String(d.getMinutes()).padStart(2,"0")+":"+
    String(d.getSeconds()).padStart(2,"0");
  if(alarm && d.getHours()===alarm.h && d.getMinutes()===alarm.m && d.getSeconds()===0){
    beep(5);alarm=null;
  }
}
function setAlarm(){
  let h=cleanInput($("alarmH"),23);
  let m=cleanInput($("alarmM"),59);
  alarm={h,m};
  $("status").textContent=`アラーム ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
}
function cancelAlarm(){alarm=null;$("status").textContent="アラーム解除"}

setInterval(updateClock,250);
updateClock();
updateScore();
setMode("timer");
</script>
</body>
</html>
