ChatGPT:
もちろん。まずはブラウザだけで動くシンプルなテトリスを、HTML 1ファイルで作ります。

index.html として保存して、ブラウザで開けば遊べます。

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テトリス</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game {
      text-align: center;
    }

    canvas {
      border: 3px solid #555;
      background: #000;
    }

    h1 {
      margin-bottom: 10px;
    }

    .info {
      margin: 10px;
      font-size: 18px;
    }

    button {
      padding: 8px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="game">
  <h1>テトリス</h1>

  <canvas id="game" width="300" height="600"></canvas>

  <div class="info">
    スコア: <span id="score">0</span>
  </div>

  <p>
    ← →：移動　
    ↓：落下　
    ↑：回転　
    Space：一気に落下
  </p>

  <button onclick="restart()">リスタート</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const COLS = 10;
const ROWS = 20;
const SIZE = 30;

ctx.scale(SIZE, SIZE);

// 色
const colors = [
  null,
  "#00ffff", // I
  "#ffff00", // O
  "#aa00ff", // T
  "#00ff00", // S
  "#ff0000", // Z
  "#0000ff", // J
  "#ff8800"  // L
];

// テトロミノ
const pieces = [
  [
    [1, 1, 1, 1]
  ],

  [
    [2, 2],
    [2, 2]
  ],

  [
    [0, 3, 0],
    [3, 3, 3]
  ],

  [
    [0, 4, 4],
    [4, 4, 0]
  ],

  [
    [5, 5, 0],
    [0, 5, 5]
  ],

  [
    [6, 0, 0],
    [6, 6, 6]
  ],

  [
    [0, 0, 7],
    [7, 7, 7]
  ]
];

let board;
let player;
let score;
let dropCounter;
let dropInterval;
let lastTime;
let gameOver;

function createBoard() {
  return Array.from(
    { length: ROWS },
    () => Array(COLS).fill(0)
  );
}

function randomPiece() {
  const piece = pieces[Math.floor(Math.random() * pieces.length)];

  return {
    matrix: piece.map(row => [...row]),
    x: Math.floor(COLS / 2) - Math.ceil(piece[0].length / 2),
    y: 0
  };
}

function drawMatrix(matrix, offset) {
  matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        ctx.fillStyle = colors[value];
        ctx.fillRect(
          x + offset.x,
          y + offset.y,
          1,
          1
        );

        // ブロックに少し立体感を出す
        ctx.strokeStyle = "#222";
        ctx.lineWidth = 0.05;
        ctx.strokeRect(
          x + offset.x,
          y + offset.y,
          1,
          1
        );
      }
    });
  });
}

function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, COLS, ROWS);

  drawMatrix(board, { x: 0, y: 0 });
  drawMatrix(player.matrix, {
    x: player.x,
    y: player.y
  });
}

function collide(board, player) {
  const matrix = player.matrix;
  const pos = player;

  for (let y = 0; y < matrix.length; y++) {
    for (let x = 0; x < matrix[y].length; x++) {
      if (
        matrix[y][x] !== 0 &&
        (
          board[y + pos.y] &&
          board[y + pos.y][x + pos.x]
        )
      ) {
        return true;
      }

      // 左右・下の壁
      if (
        matrix[y][x] !== 0 &&
        (
          x + pos.x < 0 ||
          x + pos.x >= COLS ||
          y + pos.y >= ROWS
        )
      ) {
        return true;
      }
    }
  }

  return false;
}

function merge(board, player) {
  player.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        board[y + player.y][x + player.x] = value;
      }
    });
  });
}

function rotate(matrix, dir) {
  for (let y = 0; y < matrix.length; y++) {
    for (let x = 0; x < y; x++) {
      [
        matrix[x][y],
        matrix[y][x]
      ] = [
        matrix[y][x],
        matrix[x][y]
      ];
    }
  }

  if (dir > 0) {
    matrix.forEach(row => row.reverse());
  } else {
    matrix.reverse();
  }
}

function playerRotate() {
  const oldX = player.x;
  const oldMatrix = player.matrix.map(row => [...row]);

  rotate(player.matrix, 1);

  // 壁際で回転できるように調整
  let offset = 1;

  while (collide(board, player)) {
    player.x += offset;

    offset = -(offset + (offset > 0 ? 1 : -1));

    if (offset > player.matrix[0].length) {
      player.matrix = oldMatrix;
      player.x = oldX;
      return;
    }
  }
}

function playerMove(dir) {
  player.x += dir;

  if (collide(board, player)) {
    player.x -= dir;
  }
}

function playerDrop() {
  player.y++;

  if (collide(board, player)) {
    player.y--;
    merge(board, player);
    playerReset();
    clearLines();
  }

  dropCounter = 0;
}

function hardDrop() {
  while (!collide(board, player)) {
    player.y++;
  }

  player.y--;
  merge(board, player);
  playerReset();
  clearLines();
  dropCounter = 0;
}

function playerReset() {
  player = randomPiece();

  if (collide(board, player)) {
    gameOver = true;
  }
}

function clearLines() {
  let lines = 0;

  outer:
  for (let y = ROWS - 1; y >= 0; y--) {
    for (let x = 0; x < COLS; x++) {
      if (board[y][x] === 0) {
        continue outer;
      }
    }

    board.splice(y, 1);
    board.unshift(Array(COLS).fill(0));
    y++;

    lines++;
  }

  if (lines > 0) {
    score += [0, 100, 300, 500, 800][lines];
    document.getElementById("score").textContent = score;
  }
}

function update(time = 0) {
  if (gameOver) {
    draw();

    ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
    ctx.fillRect(0, 7, COLS, 6);

    ctx.fillStyle = "white";
    ctx.font = "1px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(
      "GAME OVER",
      COLS / 2,
      10
    );

    return;
  }

  const deltaTime = time - lastTime;
  lastTime = time;

  dropCounter += deltaTime;

  if (dropCounter > dropInterval) {
    playerDrop();
  }

  draw();
  requestAnimationFrame(update);
}

document.addEventListener("keydown", event => {
  if (gameOver) return;

  if (event.key === "ArrowLeft") {
    playerMove(-1);
  }

  else if (event.key === "ArrowRight") {
    playerMove(1);
  }

  else if (event.key === "ArrowDown") {
    playerDrop();
  }

  else if (event.key === "ArrowUp") {
    playerRotate();
  }

  else if (event.code === "Space") {
    event.preventDefault();
    hardDrop();
  }

  draw();
});

function restart() {
  board = createBoard();
  score = 0;
  dropCounter = 0;
  dropInterval = 800;
  lastTime = 0;
  gameOver = false;

  document.getElementById("score").textContent = score;

  playerReset();
  update();
}

restart();
</script>

</body>
</html>
